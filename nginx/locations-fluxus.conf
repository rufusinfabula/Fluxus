# Blocchi nginx di Fluxus, estratti dal vhost condiviso dell'installazione
# di partenza. In questa fase sono verbatim: la parametrizzazione (percorsi
# e sottopercorso web configurabili, vhost autonomo) arriva con l'installer.
#
# ATTENZIONE: il blocco PHP di Fluxus deve precedere il 'location ~ \.php$'
# generico del vhost, altrimenti il timeout lungo non viene applicato.

    # PHP — fluxus-media ha bisogno di un timeout più lungo (estrazione clip ffmpeg)
    location ~ ^/fluxus-media/.*\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 300;
    }


    location /fluxus-media/ {
        alias /var/www/fluxus-media/;
        autoindex off;
        index index.php;
    }
    # Registrazioni e clip audio/video (dati privati, fuori da /var/www)
    location /fluxus-media/recordings/ {
        alias /var/lib/fluxus-media/recordings/;
        add_header Accept-Ranges bytes;
    }
    location /fluxus-media/clips/ {
        alias /var/lib/fluxus-media/clips/;
        add_header Accept-Ranges bytes;
    }
    # Registrazioni su volumi esterni (v2.5.0): in /var/lib/fluxus-media/volumes/
    # c'è un symlink per ogni volume registrato, così aggiungere un disco non
    # richiede di toccare nginx. disable_symlinks resta off (default): i link
    # sono creati solo da Fluxus e puntano alle radici dati dei volumi.
    location /fluxus-media/volumes/ {
        alias /var/lib/fluxus-media/volumes/;
        add_header Accept-Ranges bytes;
    }
    # Anteprima live: HLS effimero scritto da scripts/preview.sh.
    # Mai in cache — playlist e segmenti cambiano ogni 2s e vengono cancellati.
    location /fluxus-media/preview/ {
        alias /var/lib/fluxus-media/tmp/preview/;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t                    ts;
        }
        default_type application/octet-stream;
    }
